<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="100%" height="100%">
  <defs>
    <!-- Cyan Blue Arc Gradient -->
    <linearGradient id="omanaArchGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00A8FF" />
      <stop offset="50%" stop-color="#0088FF" />
      <stop offset="100%" stop-color="#00A8FF" />
    </linearGradient>
  </defs>

  <!-- 1. Left Orange Building -->
  <!-- Vertical left wall, climbing sloped roof to right, vertical right wall, flat bottom -->
  <polygon 
    points="328,518 465,440 465,666 328,666" 
    fill="#FF7300" 
  />

  <!-- 2. Center Red "1" Skyscraper Tower -->
  <!-- Stylized numeral '1' with high peak at top-right, sloping top-left, overhang beak, vertical stem, parallel roof notch -->
  <polygon 
    points="433,292 588,204 588,510 518,549 518,646 483,646 483,405 433,435" 
    fill="#E60026" 
  />

  <!-- 3. Right Purple Building -->
  <!-- Vertical left wall, sloped roof climbing to right, vertical right wall, flat bottom -->
  <polygon 
    points="537,560 672,485 672,666 537,666" 
    fill="#9400A8" 
  />

  <!-- 4. Sweeping Blue Arch Horizon -->
  <path 
    d="M 218 725 Q 500 666 782 725 Q 500 681 218 725 Z" 
    fill="url(#omanaArchGradient)" 
  />

  <!-- 5. OMANA PROJECTS Typography -->
  <text 
    x="500" 
    y="749" 
    font-family="'Impact', 'Arial Black', -apple-system, BlinkMacSystemFont, sans-serif" 
    font-size="44" 
    font-weight="900" 
    letter-spacing="5" 
    fill="#000000" 
    text-anchor="middle"
  >
    OMANA PROJECTS
  </text>

  <!-- 6. Tagline: One Dholera So Many Cities -->
  <text 
    x="500" 
    y="777" 
    font-family="'Plus Jakarta Sans', 'Inter', -apple-system, BlinkMacSystemFont, sans-serif" 
    font-size="18" 
    font-weight="500" 
    letter-spacing="2.5" 
    text-anchor="middle"
  >
    <tspan fill="#000000">One </tspan>
    <tspan fill="#E60026" font-weight="700">Dholera</tspan>
    <tspan fill="#000000"> So Many Cities</tspan>
  </text>
</svg>
